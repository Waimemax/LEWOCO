<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cart | Chakula Chap</title>

  <link rel="stylesheet" href="cart.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">
      <a href="home.html">
        <img src="Images/logo.svg" alt="Chakula Chap Logo" width="50">
      </a>
      <h1>Chakula Chap</h1>
    </div>

    <div class="navlinks">
      <a href="home.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="cart.html" class="active">Cart</a>
    </div>
  </nav>

  <!-- CART SECTION -->
  <section class="cart-container">
    <h1>Your Shopping Cart</h1>

    <!-- CART ITEMS WILL BE INSERTED HERE BY JS -->
    <div id="cart-items" class="cart-items"></div>

    <!-- CART SUMMARY -->
    <div class="cart-summary">
      <h3 id="cart-total">Total: KES 0</h3>

      <div class="cart-actions">
        <a href="menu.html" class="continue-btn">← Continue Shopping</a>
        <button class="checkout-btn">Checkout</button>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 Chakula Chap. All rights reserved.</p>
  </footer>

  <!-- CART SCRIPT -->
  <script src="cart.js"></script>

</body>
</html>
